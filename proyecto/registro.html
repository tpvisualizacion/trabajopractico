<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">LOGO</a>
    <nav class="menu">
      <a href="puntos.html">Puntos de reciclaje</a>
      <a href="registro.html" class="activo">Registro</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="auth">
    <form class="form">
      <h1>Crear cuenta</h1>
      <div class="campo">
        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario">
      </div>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo">
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave">
      </div>
      <div class="campo">
        <label for="clave2">Repetir contraseña</label>
        <input type="password" id="clave2">
      </div>
      <a href="inicio.html" class="btn btn-primario">Registrarme</a>
      <p class="form-pie">¿Ya tienes cuenta? <a href="login.html">Ir a Login</a></p>
    </form>
  </main>
</body>
</html>
